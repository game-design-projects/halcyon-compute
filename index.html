</head>
<body>

  <symbol id="rocket" viewBox="0 0 24 24"><path d="M12 3c3 2 5 6 5 10l-2 3H9l-2-3c0-4 2-8 5-10z"/><path d="M9 16l-2 4M15 16l2 4"/><circle cx="12" cy="10" r="1.5"/></symbol>
  <symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></symbol>
  <symbol id="tag" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.5"/></symbol>
  <symbol id="pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
  <symbol id="play1" viewBox="0 0 24 24"><path d="M8 5v14l10-7z" fill="currentColor"/></symbol>
  <symbol id="play2" viewBox="0 0 24 24"><path d="M4 6v12l8-6zM12 6v12l8-6z" fill="currentColor"/></symbol>
  <symbol id="play3" viewBox="0 0 24 24"><path d="M2 7v10l6-5zM9 7v10l6-5zM16 7v10l6-5z" fill="currentColor"/></symbol>
  <symbol id="trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></symbol>
  <symbol id="truck" viewBox="0 0 24 24"><path d="M2 7h11v9H2zM13 10h4l3 3v3h-7z"/><circle cx="6" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></symbol>
  <symbol id="news" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M7 8h10M7 12h10M7 16h6"/></symbol>
  <symbol id="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
  <symbol id="brain" viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a3 3 0 0 0-3-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/></symbol>
  <symbol id="bubble" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>

  <symbol id="cross" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
  <symbol id="box" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></symbol>
  <symbol id="doc" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></symbol>
  <symbol id="hand" viewBox="0 0 24 24"><path d="M2 11l4-4 4 2 3-2 4 1 5 4"/><path d="M6 13l4 4 2-1 2 2 4-4M10 9l-3 3 2 2 3-3"/></symbol>
  <symbol id="bank" viewBox="0 0 24 24"><path d="M3 10 12 4l9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></symbol>
  <symbol id="building" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M8 15h2M14 15h2"/></symbol>
  <symbol id="battery" viewBox="0 0 24 24"><rect x="3" y="7" width="16" height="10" rx="1"/><path d="M21 10v4M7 10v4M11 10v4"/></symbol>
  <symbol id="pie" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l7 5"/></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.8-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1-4.4-4.3 6.1-.8z"/></symbol>
  <symbol id="burger" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="play4" viewBox="0 0 24 24"><path d="M1 7v10l5-5zM6.5 7v10l5-5zM12 7v10l5-5zM17.5 7v10l5-5z" fill="currentColor"/></symbol>
  <symbol id="flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></symbol>
  <symbol id="cart" viewBox="0 0 24 24"><path d="M3 4h3l2 11h11l2-8H7"/><circle cx="9" cy="19" r="1.5"/><circle cx="18" cy="19" r="1.5"/></symbol>
  <symbol id="heart" viewBox="0 0 24 24"><path d="M12 20s-8-5-8-11a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 6-8 11-8 11z"/></symbol>
  <symbol id="robot" viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="11" rx="2"/><path d="M12 4v4M9 13h.01M15 13h.01"/></symbol>
  <symbol id="game" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="10" rx="4"/><path d="M7 13h4M9 11v4M16 12h.01M18 14h.01"/></symbol>
  <symbol id="film" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M10 9v6l5-3z"/></symbol>
  <symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="sound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>

  <symbol id="power" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.4 7.2a8 8 0 1 0 11.2 0"/></symbol>

  <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="skip" viewBox="0 0 24 24"><path d="M5 6v12l9-6z" fill="currentColor"/><path d="M18 6v12"/></symbol>
  <symbol id="unplug" viewBox="0 0 24 24"><path d="M8 3v4M13 3v4M6 7h9v4a4.5 4.5 0 0 1-9 0z"/><path d="M10.5 15.5V21"/><path d="M3 3l18 18"/></symbol>
  <symbol id="keyboard" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></symbol>
  <symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="1"/><path d="M16 8V4H4v12h4"/></symbol>
  <symbol id="link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
</svg>

<div class="stage" id="stage">
<header class="hud" id="hud">
  <button class="iconbtn" id="menubtn" data-i18n-title="hud.menu"><svg class="i"><use href="#burger"/></svg></button>
  <div class="chip" id="h-cashchip"><svg class="i"><use href="#coin"/></svg><div><span class="big" id="h-cash"></span><span class="delta" id="h-cash-d"></span><small id="h-rate" style="display:block"></small><div class="bar runway" id="h-runway"><i class="ghostbar"></i><i class="now"></i></div></div></div>
  <div class="chip click" id="h-techs"></div>
  <div class="chip" id="h-when"></div>
  <div class="speed" role="group" data-i18n-aria="hud.speed">
    <button data-speed="0" data-i18n-title="hud.pause"><svg class="i"><use href="#pause"/></svg></button>
    <button data-speed="1" data-i18n-title="hud.x1"><svg class="i"><use href="#play1"/></svg></button>
    <button data-speed="2" data-i18n-title="hud.x2"><svg class="i"><use href="#play2"/></svg></button>
    <button data-speed="4" data-i18n-title="hud.x4"><svg class="i"><use href="#play3"/></svg></button>
    <button data-speed="8" data-i18n-title="hud.x8"><svg class="i"><use href="#play4"/></svg></button>
    <button id="skipbtn" data-i18n-title="skip.tip" aria-pressed="false"><svg class="i"><use href="#skip"/></svg></button>
  </div>
  <div class="chip click" id="h-power"></div>
  <div class="chip" id="h-heat"></div>
  <div class="chip click" id="h-transit" hidden></div>
  <div class="chip" id="h-score"></div>
  <div class="chip pace" id="h-pace" hidden></div>
  <span class="spacer"></span>
  <div class="drawer-btns" id="drawer-btns">
    <button class="iconbtn labeled board-dup" data-drawer="contracts" id="db-contracts" data-i18n-title="dr.contractsTip" hidden><svg class="i"><use href="#hand"/></svg><span class="lbl" data-i18n="dr.contracts">Contracts</span><span class="dot" hidden></span></button>
    <button class="iconbtn" data-drawer="finance" id="db-finance" data-i18n-title="dr.financeTip"><svg class="i"><use href="#trend"/></svg><span class="dot" hidden></span></button>
    <button class="iconbtn" data-drawer="energy" id="db-energy" data-i18n-title="dr.energy" hidden><svg class="i"><use href="#bolt"/></svg><span class="dot" hidden></span></button>
    <button class="iconbtn" data-drawer="affairs" id="db-affairs" data-i18n-title="dr.affairs" hidden><svg class="i"><use href="#flag"/></svg><span class="dot" hidden></span></button>
  </div>
  <button class="iconbtn" id="alertbtn" data-i18n-title="hud.alerts" data-i18n-aria="alerts.title"><svg class="i"><use href="#bell"/></svg><span class="dot" hidden></span></button>
  <button class="iconbtn langbtn" id="langbtn" type="button">中</button>
  <button class="iconbtn" id="fsbtn" aria-pressed="false"><svg class="i"><use href="#expand"/></svg></button>
  <button class="iconbtn" id="mutebtn"><svg class="i"><use href="#sound"/></svg></button>
  <button class="iconbtn" id="setbtn" data-i18n-title="hud.settings" data-i18n-aria="set.title"><svg class="i"><use href="#gear"/></svg></button>
  <button class="iconbtn" id="helpbtn" data-i18n-title="hud.help"><svg class="i"><use href="#help"/></svg></button>
  <div class="pop" id="pop" hidden></div>
</header>

<div class="banners" id="banners"></div>

<div class="game">
  <section class="floor-wrap">
    <div class="goal" id="goal"></div>
    <div class="offerstrip board" id="offerstrip" hidden aria-live="polite"></div>
    <div class="floorbar"><div class="halltabs" id="halltabs" role="group" data-i18n-aria="hud.halls"></div><div class="modes" role="group" data-i18n-aria="hud.mapMode" id="modes"></div><div class="legend" id="legend"></div></div>
    <div class="floor-scroll"><div class="floor" id="floor"></div><div class="boxsel" id="boxsel" hidden></div><div class="bulkbar" id="bulkbar" hidden></div></div>
    <div class="shelf-wrap" id="shelf-wrap" hidden>
      <div class="shelf-head"><h2 data-i18n="shelf.title">Spares</h2><span id="shelf-n"></span></div>
      <div class="shelf" id="shelf" data-drop-shelf></div>
    </div>
    <div class="tray-title" id="tray-title"></div>
    <div class="tray" id="tray"></div>
  </section>

  <aside class="side">
    <div class="corp" id="corp" data-i18n-aria="hud.company">
      <div class="chip click" id="h-debt" data-drawer="finance" hidden></div>
      <div class="chip click" id="h-rep" data-drawer="affairs" hidden></div>
      <div class="chip click" id="h-carbon" data-drawer="energy" hidden></div>
      <div class="chip click" id="h-equity" data-drawer="finance" hidden></div>
    </div>
    <div class="card tabcard" id="infotabs">
      <div class="tabs" role="tablist" data-i18n-aria="tab.aria">
        <button role="tab" id="tab-rack" data-tab="rack" aria-selected="true" aria-controls="pane-rack"><svg class="i"><use href="#cpu"/></svg><span id="tab-rack-lbl" data-i18n="tab.rack">Rack</span></button>
        <button role="tab" id="tab-news" data-tab="news" aria-selected="false" aria-controls="pane-news"><svg class="i"><use href="#news"/></svg><span data-i18n="tab.news">News</span><span class="dot" hidden></span></button>
        <button role="tab" id="tab-markets" data-tab="markets" aria-selected="false" aria-controls="pane-markets"><svg class="i"><use href="#coin"/></svg><span data-i18n="tab.markets">Markets</span></button>
        <button role="tab" id="tab-bench" data-tab="bench" aria-selected="false" aria-controls="pane-bench"><svg class="i"><use href="#chip"/></svg><span data-i18n="tab.bench">Benchmarks</span></button>
      </div>
      <div class="pane rackpane" role="tabpanel" id="pane-rack" aria-labelledby="tab-rack"><div id="detail"></div></div>
      <div class="pane chart" role="tabpanel" id="pane-markets" aria-labelledby="tab-markets" hidden>
        <h2><svg class="i"><use href="#coin"/></svg><span data-i18n="mk.title">Compute markets</span></h2>
        <div class="market-legend" id="market-legend"></div>
        <svg viewBox="0 0 320 150" id="market-chart" role="img" data-i18n-aria="mk.aria"></svg>
      </div>
      <div class="pane chart" role="tabpanel" id="pane-bench" aria-labelledby="tab-bench" hidden>
        <div id="bench-card">
          <h2 data-i18n-title="bench.sub"><svg class="i"><use href="#chip"/></svg><span data-i18n="bench.title">Vendor benchmarks</span></h2>
          <svg viewBox="0 0 300 140" id="bench-chart" role="img" data-i18n-aria="bench.sub"></svg>
        </div>
      </div>
      <div class="pane newspane" role="tabpanel" id="pane-news" aria-labelledby="tab-news" hidden>
        <div class="newsfilter" id="newsfilter" role="group" data-i18n-aria="news.filter"></div>
        <div class="news" id="newsfeed"></div>
      </div>
    </div>
  </aside>
</div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <header><h2 id="drawer-title"></h2><span class="sub" id="drawer-sub"></span><button class="iconbtn" id="drawer-close" data-i18n-title="btn.close"><svg class="i"><use href="#cross"/></svg></button></header>
  <div class="dbody" id="drawer-body"></div>
</aside>

<div class="toast" id="toast" role="status"></div>
<div class="hovercard" id="hovercard" hidden role="tooltip"></div>
<div class="sr-only" id="sr" aria-live="polite"></div>
<div class="undo" id="undo" role="status" aria-live="polite"><span id="undo-msg"></span><button class="btn" id="undo-btn" type="button"><svg class="i"><use href="#undoarrow"/></svg><span data-i18n="sold.undo">Undo</span></button><i class="undo-bar"></i></div>
<div class="teach" id="teach" hidden aria-hidden="true"></div>
<div class="qcard" id="qcard" aria-live="polite"></div>

<div class="mainmenu" id="mainmenu">
  <div class="menucard">
    <div class="menuhead"><span class="logo big">Halcyon Compute</span><span class="sub" data-i18n="menu.tag">Build a datacenter. Read the signals. Five years.</span><span class="mlang" id="m-lang"></span></div>
    <div class="menubtns">
      <button class="mbtn primary" id="m-continue" hidden><svg class="i"><use href="#play1"/></svg><span><b data-i18n="menu.continue">Continue</b><small id="m-continue-sub"></small></span></button>
      <button class="mbtn" id="m-campaign"><svg class="i"><use href="#flag"/></svg><span><b data-i18n="menu.campaignNew">New campaign</b><small data-i18n="menu.campaignSub">17 chapters, one mechanic at a time</small></span></button>
      <button class="mbtn" id="m-sandbox"><svg class="i"><use href="#layers"/></svg><span><b data-i18n="menu.sandbox">Sandbox</b><small data-i18n="menu.sandboxSub">Everything unlocked from day 0</small></span></button>
      <label class="seedrow"><svg class="i"><use href="#globe"/></svg><span data-i18n="menu.seed">Seed</span><input id="m-seed" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="9" data-i18n-aria="menu.seed"><button class="btn" id="m-dice" data-i18n-title="menu.dice" type="button"><svg class="i"><use href="#rocket"/></svg></button></label>
      <button class="mbtn ghostbtn" id="m-load"><svg class="i"><use href="#box"/></svg><span><b id="m-load-t" data-i18n="menu.load">Load / import a save</b></span></button>
      <button class="mbtn ghostbtn" id="m-how"><svg class="i"><use href="#help"/></svg><span><b data-i18n="menu.how">How to play</b></span></button>
      <button class="mbtn ghostbtn" id="m-export" hidden><svg class="i"><use href="#download"/></svg><span><b data-i18n="set.log">Export gameplay log</b><small data-i18n="menu.logSub">JSON: seed + every action, replayable</small></span></button>
      <button class="mbtn ghostbtn" id="m-tele" hidden><svg class="i"><use href="#globe"/></svg><span><b data-i18n="menu.tele">Share anonymous gameplay data</b><small id="m-tele-sub"></small></span></button>
      <button class="mbtn ghostbtn" id="m-resume" hidden><svg class="i"><use href="#cross"/></svg><span><b data-i18n="menu.resume">Back to the game</b></span></button>
    </div>
    <div class="howto" id="m-howto" hidden></div>
  </div>
</div>

<dialog id="chapter" class="chap" aria-labelledby="ct">
  <header><h2 id="ct"></h2><span style="color:var(--hud-ink-2)" id="csub"></span></header>
  <div class="body" id="cbody"></div>
  <footer><button class="end" data-close data-i18n="btn.gotIt">Got it</button></footer>
</dialog>

<dialog id="card" class="chap cardlg" aria-labelledby="kt">
  <header><h2 id="kt"></h2><span style="color:var(--hud-ink-2)" id="ksub"></span></header>
  <div class="body" id="kbody"></div>
  <footer id="kfoot" style="gap:8px"></footer>
</dialog>

<dialog id="settings" class="chap setdlg" aria-labelledby="st-t">
  <header><h2 id="st-t"></h2><button class="iconbtn" data-close data-i18n-title="btn.close"><svg class="i"><use href="#cross"/></svg></button></header>
  <div class="body" id="st-body"></div>
  <input type="file" id="st-file" accept=".json,application/json" hidden>
</dialog>

<dialog id="keys" class="chap keysdlg" aria-labelledby="ky-t">
  <header><h2 id="ky-t"></h2><button class="iconbtn" data-close data-i18n-title="btn.close"><svg class="i"><use href="#cross"/></svg></button></header>
  <div class="body" id="ky-body"></div>
  <footer id="ky-foot" style="gap:8px"></footer>
</dialog>

<dialog id="over" class="overdlg" aria-labelledby="ot">
  <header><h2 id="ot"></h2><span style="color:var(--hud-ink-2)" id="osub"></span></header>
  <div class="body" id="obody"></div>
  <footer style="gap:8px"><button class="btn" id="o-export"><svg class="i"><use href="#download"/></svg><span data-i18n="end.export">Export log</span></button><button class="btn" id="same-seed" data-i18n="end.replay">Replay this seed</button><button class="end" id="new-game" data-i18n="end.menu">Main menu</button></footer>
</dialog>
