<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halcyon Compute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></symbol>
  <symbol id="bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-2 8 9-12h-7l2-8z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="temp" viewBox="0 0 24 24"><path d="M10 4a2 2 0 0 1 4 0v10a4 4 0 1 1-4 0z"/><path d="M12 9v7"/></symbol>
  <symbol id="net" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><path d="M7 12h4l6-6M11 12l6 6"/></symbol>
  <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3 6 9 7 9-7"/></symbol>
  <symbol id="chip" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10"/><path d="M9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
  <symbol id="snow" viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></symbol>
  <symbol id="cpu" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/><rect x="9" y="9" width="6" height="6"/></symbol>
  <symbol id="switch" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="1"/><path d="M7 12h.01M10.5 12h.01M14 12h.01M17.5 12h.01"/></symbol>
  <symbol id="flame" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 1 1 2 2 3 3V3z" fill="#FF8466" stroke="#FFD1C4" stroke-width="1"/></symbol>
  <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#E0A43A" stroke="#FFE3B0" stroke-width="1.5"/><path d="M12 8v4l3 2" stroke="#3A2A10"/></symbol>
  <symbol id="drop" viewBox="0 0 24 24"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z" fill="#8FC4FF" stroke="#E0F0FF" stroke-width="1"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="wrench" viewBox="0 0 24 24"><path d="M15 4a5 5 0 0 0-4.6 6.9L4 17.3 6.7 20l6.4-6.4A5 5 0 0 0 20 9l-3 1-3-3z"/></symbol>
  <symbol id="layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
  <symbol id="gauge" viewBox="0 0 24 24"><path d="M4 16a8 8 0 1 1 16 0"/><path d="m12 16 4-5"/></symbol>
  <symbol id="leaf" viewBox="0 0 24 24"><path d="M5 19C5 10 11 5 20 4c0 9-5 15-14 15z"/><path d="M5 19 13 11"/></symbol>
  <symbol id="rocket" viewBox="0 0 24 24"><path d="M12 3c3 2 5 6 5 10l-2 3H9l-2-3c0-4 2-8 5-10z"/><path d="M9 16l-2 4M15 16l2 4"/><circle cx="12" cy="10" r="1.5"/></symbol>
  <symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></symbol>
  <symbol id="tag" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.5"/></symbol>
  <symbol id="pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
  <symbol id="play1" viewBox="0 0 24 24"><path d="M8 5v14l10-7z" fill="currentColor"/></symbol>
  <symbol id="play2" viewBox="0 0 24 24"><path d="M4 6v12l8-6zM12 6v12l8-6z" fill="currentColor"/></symbol>
  <symbol id="play3" viewBox="0 0 24 24"><path d="M2 7v10l6-5zM9 7v10l6-5zM16 7v10l6-5z" fill="currentColor"/></symbol>
  <symbol id="trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></symbol>
  <symbol id="truck" viewBox="0 0 24 24"><path d="M2 7h11v9H2zM13 10h4l3 3v3h-7z"/><circle cx="6" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></symbol>
  <symbol id="news" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M7 8h10M7 12h10M7 16h6"/></symbol>
  <symbol id="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
  <symbol id="brain" viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a3 3 0 0 0-3-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/></symbol>
  <symbol id="bubble" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5V14M12 17h.01"/></symbol>
  <symbol id="flag" viewBox="0 0 24 24"><path d="M5 21V4h11l-2 4 2 4H5"/></symbol>
  <symbol id="warn" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></symbol>
  <symbol id="undoarrow" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
  <symbol id="cross" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
  <symbol id="box" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></symbol>
  <symbol id="doc" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></symbol>
  <symbol id="hand" viewBox="0 0 24 24"><path d="M2 11l4-4 4 2 3-2 4 1 5 4"/><path d="M6 13l4 4 2-1 2 2 4-4M10 9l-3 3 2 2 3-3"/></symbol>
  <symbol id="bank" viewBox="0 0 24 24"><path d="M3 10 12 4l9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></symbol>
  <symbol id="building" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M8 15h2M14 15h2"/></symbol>
  <symbol id="battery" viewBox="0 0 24 24"><rect x="3" y="7" width="16" height="10" rx="1"/><path d="M21 10v4M7 10v4M11 10v4"/></symbol>
  <symbol id="pie" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l7 5"/></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.8-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1-4.4-4.3 6.1-.8z"/></symbol>
  <symbol id="burger" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="play4" viewBox="0 0 24 24"><path d="M1 7v10l5-5zM6.5 7v10l5-5zM12 7v10l5-5zM17.5 7v10l5-5z" fill="currentColor"/></symbol>
  <symbol id="flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></symbol>
  <symbol id="cart" viewBox="0 0 24 24"><path d="M3 4h3l2 11h11l2-8H7"/><circle cx="9" cy="19" r="1.5"/><circle cx="18" cy="19" r="1.5"/></symbol>
  <symbol id="heart" viewBox="0 0 24 24"><path d="M12 20s-8-5-8-11a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 6-8 11-8 11z"/></symbol>
  <symbol id="robot" viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="11" rx="2"/><path d="M12 4v4M9 13h.01M15 13h.01"/></symbol>
  <symbol id="game" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="10" rx="4"/><path d="M7 13h4M9 11v4M16 12h.01M18 14h.01"/></symbol>
  <symbol id="film" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M10 9v6l5-3z"/></symbol>
  <symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="sound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
  <symbol id="mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="m17 9 5 6M22 9l-5 6"/></symbol>
  <symbol id="factory" viewBox="0 0 24 24"><path d="M3 21V10l6 4V10l6 4V6h6v15z"/></symbol>
</svg>

<header class="hud" id="hud">
  <button class="iconbtn" id="menubtn" title="Main menu"><svg class="i"><use href="#burger"/></svg></button>
  <span class="logo">Halcyon</span>
  <div class="chip" id="h-cashchip" title="Cash and current net income per day"><svg class="i"><use href="#coin"/></svg><div><span class="big" id="h-cash"></span><span class="delta" id="h-cash-d"></span><small id="h-rate" style="display:block"></small><div class="bar runway" id="h-runway"><i class="ghostbar"></i><i class="now"></i></div></div></div>
  <div class="chip click" id="h-techs" title="Technicians install, move, repair and sell hardware. Filled = free"></div>
  <div class="chip" id="h-when"></div>
  <div class="speed" role="group" aria-label="Game speed">
    <button data-speed="0" title="Pause (space)"><svg class="i"><use href="#pause"/></svg></button>
    <button data-speed="1" title="1x speed (1)"><svg class="i"><use href="#play1"/></svg></button>
    <button data-speed="2" title="2x speed (2)"><svg class="i"><use href="#play2"/></svg></button>
    <button data-speed="4" title="4x speed (3)"><svg class="i"><use href="#play3"/></svg></button>
    <button data-speed="8" title="8x speed (4)"><svg class="i"><use href="#play4"/></svg></button>
  </div>
  <div class="chip click" id="h-power"></div>
  <div class="chip" id="h-heat"></div>
  <div class="chip click" id="h-transit" hidden></div>
  <div class="chip click" id="h-debt" data-drawer="finance" hidden></div>
  <div class="chip click" id="h-rep" data-drawer="affairs" hidden></div>
  <div class="chip click" id="h-carbon" data-drawer="energy" hidden></div>
  <div class="chip click" id="h-equity" data-drawer="finance" hidden></div>
  <div class="chip" id="h-score"></div>
  <div class="chip pace" id="h-pace" hidden title="Pace: two bots play your seed alongside you, up to today"></div>
  <span class="spacer"></span>
  <div class="drawer-btns" id="drawer-btns">
    <button class="iconbtn labeled" data-drawer="contracts" id="db-contracts" title="Contracts: offers, active contracts, track record" hidden><svg class="i"><use href="#hand"/></svg><span class="lbl">Contracts</span><span class="dot" hidden></span></button>
    <button class="iconbtn" data-drawer="finance" id="db-finance" title="Finance: quarter results, debt, leases, investors"><svg class="i"><use href="#trend"/></svg><span class="dot" hidden></span></button>
    <button class="iconbtn" data-drawer="energy" id="db-energy" title="Energy, facilities and environment" hidden><svg class="i"><use href="#bolt"/></svg><span class="dot" hidden></span></button>
    <button class="iconbtn" data-drawer="affairs" id="db-affairs" title="Reputation and policy" hidden><svg class="i"><use href="#flag"/></svg><span class="dot" hidden></span></button>
  </div>
  <button class="iconbtn" id="mutebtn" title="Sound (M)"><svg class="i"><use href="#sound"/></svg></button>
  <button class="iconbtn" id="helpbtn" title="Replay the current chapter card"><svg class="i"><use href="#help"/></svg></button>
  <div class="pop" id="pop" hidden></div>
</header>

<div class="banners" id="banners"></div>

<div class="game">
  <section class="floor-wrap">
    <div class="goal" id="goal"></div>
    <div class="offerstrip" id="offerstrip" hidden aria-live="polite"></div>
    <div class="floorbar"><div class="halltabs" id="halltabs" role="group" aria-label="Hall"></div><div class="modes" role="group" aria-label="Map mode" id="modes"></div></div>
    <div class="legend" id="legend"></div>
    <div class="floor-scroll"><div class="floor" id="floor"></div></div>
    <div class="shelf-wrap" id="shelf-wrap" hidden>
      <div class="tray-title"><h2>Spares shelf</h2><span id="shelf-sub"></span></div>
      <div class="shelf" id="shelf" data-drop-shelf></div>
    </div>
    <div class="tray-title" id="tray-title"></div>
    <div class="tray" id="tray"></div>
  </section>

  <aside class="side"><div class="card" id="detail"></div></aside>

  <div class="strip">
    <div class="card chart">
      <h2 style="font-size:17px"><svg class="i"><use href="#coin"/></svg>Compute markets</h2>
      <div class="market-legend" id="market-legend"></div>
      <svg viewBox="0 0 320 150" id="market-chart" role="img" aria-label="Price and demand history for training and inference"></svg>
    </div>
    <div class="card chart" id="bench-card">
      <h2 style="font-size:17px"><svg class="i"><use href="#chip"/></svg>Vendor benchmarks</h2>
      <div class="sub">Performance per kW, as reported by each vendor. Past data only.</div>
      <svg viewBox="0 0 300 140" id="bench-chart" role="img" aria-label="Vendor-reported benchmarks for emerging accelerators"></svg>
    </div>
    <div class="card">
      <h2 style="font-size:17px"><svg class="i"><use href="#news"/></svg>News</h2>
      <div class="newsfilter" id="newsfilter" role="group" aria-label="Filter news"></div>
      <div class="news" id="newsfeed"></div>
    </div>
  </div>
</div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <header><h2 id="drawer-title"></h2><span class="sub" id="drawer-sub"></span><button class="iconbtn" id="drawer-close" title="Close (Esc)"><svg class="i"><use href="#cross"/></svg></button></header>
  <div class="dbody" id="drawer-body"></div>
</aside>

<div class="toast" id="toast" role="status"></div>
<div class="undo" id="undo" role="status" aria-live="polite"><span id="undo-msg"></span><button class="btn" id="undo-btn" type="button"><svg class="i"><use href="#undoarrow"/></svg>Undo</button><i class="undo-bar"></i></div>
<div class="qcard" id="qcard" aria-live="polite"></div>

<div class="mainmenu" id="mainmenu">
  <div class="menucard">
    <div class="menuhead"><span class="logo big">Halcyon Compute</span><span class="sub">Build a datacenter. Read the signals. Five years.</span></div>
    <div class="menubtns">
      <button class="mbtn primary" id="m-continue" hidden><svg class="i"><use href="#play1"/></svg><span><b>Continue</b><small id="m-continue-sub"></small></span></button>
      <button class="mbtn" id="m-campaign"><svg class="i"><use href="#flag"/></svg><span><b>New campaign</b><small>17 chapters, one mechanic at a time</small></span></button>
      <button class="mbtn" id="m-sandbox"><svg class="i"><use href="#layers"/></svg><span><b>Sandbox</b><small>Everything unlocked from day 0</small></span></button>
      <label class="seedrow"><svg class="i"><use href="#globe"/></svg><span>Seed</span><input id="m-seed" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="9" aria-label="Seed"><button class="btn" id="m-dice" title="Random seed" type="button"><svg class="i"><use href="#rocket"/></svg></button></label>
      <button class="mbtn ghostbtn" id="m-how"><svg class="i"><use href="#help"/></svg><span><b>How to play</b></span></button>
      <button class="mbtn ghostbtn" id="m-resume" hidden><svg class="i"><use href="#cross"/></svg><span><b>Back to the game</b></span></button>
    </div>
    <div class="howto" id="m-howto" hidden></div>
  </div>
</div>

<dialog id="chapter" class="chap" aria-labelledby="ct">
  <header><h2 id="ct"></h2><span style="color:var(--hud-ink-2)" id="csub"></span></header>
  <div class="body" id="cbody"></div>
  <footer><button class="end" data-close>Got it</button></footer>
</dialog>

<dialog id="card" class="chap cardlg" aria-labelledby="kt">
  <header><h2 id="kt"></h2><span style="color:var(--hud-ink-2)" id="ksub"></span></header>
  <div class="body" id="kbody"></div>
  <footer id="kfoot" style="gap:8px"></footer>
</dialog>

<dialog id="over" class="overdlg" aria-labelledby="ot">
  <header><h2 id="ot"></h2><span style="color:var(--hud-ink-2)" id="osub"></span></header>
  <div class="body" id="obody"></div>
  <footer style="gap:8px"><button class="btn" id="same-seed">Replay this seed</button><button class="end" id="new-game">Main menu</button></footer>
</dialog>

<script src="js/content.js"></script>
<script src="js/sim.js"></script>
<script src="bots/bots.js"></script>
<script src="js/pace.js"></script>
<script src="js/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
