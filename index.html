<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halcyon Compute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></symbol>
  <symbol id="bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-2 8 9-12h-7l2-8z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="temp" viewBox="0 0 24 24"><path d="M10 4a2 2 0 0 1 4 0v10a4 4 0 1 1-4 0z"/><path d="M12 9v7"/></symbol>
  <symbol id="net" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><path d="M7 12h4l6-6M11 12l6 6"/></symbol>
  <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3 6 9 7 9-7"/></symbol>
  <symbol id="chip" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10"/><path d="M9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
  <symbol id="snow" viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></symbol>
  <symbol id="cpu" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/><rect x="9" y="9" width="6" height="6"/></symbol>
  <symbol id="switch" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="1"/><path d="M7 12h.01M10.5 12h.01M14 12h.01M17.5 12h.01"/></symbol>
  <symbol id="flame" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 1 1 2 2 3 3V3z" fill="#FF8466" stroke="#FFD1C4" stroke-width="1"/></symbol>
  <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#E0A43A" stroke="#FFE3B0" stroke-width="1.5"/><path d="M12 8v4l3 2" stroke="#3A2A10"/></symbol>
  <symbol id="drop" viewBox="0 0 24 24"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z" fill="#8FC4FF" stroke="#E0F0FF" stroke-width="1"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="wrench" viewBox="0 0 24 24"><path d="M15 4a5 5 0 0 0-4.6 6.9L4 17.3 6.7 20l6.4-6.4A5 5 0 0 0 20 9l-3 1-3-3z"/></symbol>
  <symbol id="layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
  <symbol id="gauge" viewBox="0 0 24 24"><path d="M4 16a8 8 0 1 1 16 0"/><path d="m12 16 4-5"/></symbol>
  <symbol id="leaf" viewBox="0 0 24 24"><path d="M5 19C5 10 11 5 20 4c0 9-5 15-14 15z"/><path d="M5 19 13 11"/></symbol>
  <symbol id="rocket" viewBox="0 0 24 24"><path d="M12 3c3 2 5 6 5 10l-2 3H9l-2-3c0-4 2-8 5-10z"/><path d="M9 16l-2 4M15 16l2 4"/><circle cx="12" cy="10" r="1.5"/></symbol>
  <symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></symbol>
  <symbol id="tag" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.5"/></symbol>
  <symbol id="pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
  <symbol id="play1" viewBox="0 0 24 24"><path d="M8 5v14l10-7z" fill="currentColor"/></symbol>
  <symbol id="play2" viewBox="0 0 24 24"><path d="M4 6v12l8-6zM12 6v12l8-6z" fill="currentColor"/></symbol>
  <symbol id="play3" viewBox="0 0 24 24"><path d="M2 7v10l6-5zM9 7v10l6-5zM16 7v10l6-5z" fill="currentColor"/></symbol>
  <symbol id="trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></symbol>
  <symbol id="truck" viewBox="0 0 24 24"><path d="M2 7h11v9H2zM13 10h4l3 3v3h-7z"/><circle cx="6" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></symbol>
  <symbol id="news" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M7 8h10M7 12h10M7 16h6"/></symbol>
  <symbol id="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
  <symbol id="brain" viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a3 3 0 0 0-3-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/></symbol>
  <symbol id="bubble" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5V14M12 17h.01"/></symbol>
  <symbol id="flag" viewBox="0 0 24 24"><path d="M5 21V4h11l-2 4 2 4H5"/></symbol>
  <symbol id="warn" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></symbol>
</svg>

<header class="hud">
  <span class="logo">Halcyon</span>
  <div class="chip" title="Cash and current net income per day"><svg class="i"><use href="#coin"/></svg><div><span class="big" id="h-cash"></span><span class="delta" id="h-cash-d"></span><small id="h-rate" style="display:block"></small></div></div>
  <div class="chip" id="h-techs" title="Technicians install, move and sell hardware. Filled = free"></div>
  <div class="chip" id="h-when"></div>
  <div class="speed" role="group" aria-label="Game speed">
    <button data-speed="0" title="Pause (space)"><svg class="i"><use href="#pause"/></svg></button>
    <button data-speed="1" title="Normal speed (1)"><svg class="i"><use href="#play1"/></svg></button>
    <button data-speed="2" title="Fast (2)"><svg class="i"><use href="#play2"/></svg></button>
    <button data-speed="4" title="Fastest (3)"><svg class="i"><use href="#play3"/></svg></button>
  </div>
  <div class="chip click" id="h-power"></div>
  <div class="chip" id="h-heat"></div>
  <div class="chip" id="h-worth" title="Net worth: cash plus what your hardware would resell for. This is your score."></div>
  <span class="spacer"></span>
  <button class="iconbtn" id="ledger" title="Quarter so far"><svg class="i"><use href="#trend"/></svg></button>
  <button class="iconbtn" id="helpbtn" title="Replay the current chapter"><svg class="i"><use href="#help"/></svg></button>
</header>

<div class="game">
  <section class="floor-wrap">
    <div class="goal" id="goal"></div>
    <div class="modes" role="group" aria-label="Map mode" id="modes"></div>
    <div class="floor-scroll"><div class="floor" id="floor"></div></div>
    <div class="tray-title"><h2>Catalog</h2><span>Drag onto a rack (or tap a card, then a rack). Ships in 6 days, then a technician installs it in 2.</span></div>
    <div class="tray" id="tray"></div>
  </section>

  <aside class="side"><div class="card" id="detail"></div></aside>

  <div class="strip">
    <div class="card chart">
      <h2 style="font-size:17px"><svg class="i"><use href="#coin"/></svg>Compute markets</h2>
      <div class="market-legend" id="market-legend"></div>
      <svg viewBox="0 0 320 150" id="market-chart" role="img" aria-label="Price and demand history for training and inference"></svg>
    </div>
    <div class="card chart" id="bench-card">
      <h2 style="font-size:17px"><svg class="i"><use href="#chip"/></svg>Vendor benchmarks</h2>
      <div class="sub">Performance per kW, as reported by each vendor. Past data only.</div>
      <svg viewBox="0 0 300 140" id="bench-chart" role="img" aria-label="Vendor-reported benchmarks for emerging accelerators"></svg>
    </div>
    <div class="card">
      <h2 style="font-size:17px"><svg class="i"><use href="#news"/></svg>News</h2>
      <div class="news" id="newsfeed" style="margin-top:8px"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<dialog id="report" aria-labelledby="rt">
  <header><h2 id="rt"></h2><span style="color:var(--hud-ink-2)" id="rsub"></span></header>
  <div class="body"><svg viewBox="0 0 620 230" id="waterfall" role="img" aria-label="Quarterly waterfall: revenue, costs and net"></svg></div>
  <footer><button class="end" data-close>Back to the floor</button></footer>
</dialog>

<dialog id="chapter" class="chap" aria-labelledby="ct">
  <header><h2 id="ct"></h2><span style="color:var(--hud-ink-2)" id="csub"></span></header>
  <div class="body" id="cbody"></div>
  <footer><button class="end" data-close>Got it</button></footer>
</dialog>

<dialog id="over" aria-labelledby="ot">
  <header><h2 id="ot"></h2><span style="color:var(--hud-ink-2)" id="osub"></span></header>
  <div class="body" id="obody"></div>
  <footer style="gap:8px"><button class="btn" id="same-seed">Replay this seed</button><button class="end" id="new-game">New game</button></footer>
</dialog>

<script src="js/sim.js"></script>
<script src="bots/bots.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
